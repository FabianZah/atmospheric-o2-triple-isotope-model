name: oxytib

services:
  model-api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: "oxytib:${OXYTIB_VERSION:-0.1.0}"
    restart: unless-stopped
    environment:
      OXYTIB_CORS_ORIGINS: "${OXYTIB_CORS_ORIGINS:-}"
      OXYTIB_MAX_REQUEST_BYTES: "${OXYTIB_MAX_REQUEST_BYTES:-1048576}"
      OXYTIB_MAX_COMPUTE_REQUESTS: "${OXYTIB_MAX_COMPUTE_REQUESTS:-2}"
      OXYTIB_COMPUTE_QUEUE_TIMEOUT_SECONDS: "${OXYTIB_COMPUTE_QUEUE_TIMEOUT_SECONDS:-1.0}"
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: "${OXYTIB_PIDS:-256}"
    mem_limit: "${OXYTIB_MEMORY:-2g}"
    cpus: "${OXYTIB_CPUS:-2.0}"
    stop_grace_period: 30s
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  caddy:
    image: "${CADDY_IMAGE:-caddy:2.11.4-alpine}"
    restart: unless-stopped
    depends_on:
      model-api:
        condition: service_healthy
    environment:
      OXYTIB_DOMAIN: "${OXYTIB_DOMAIN:?set OXYTIB_DOMAIN}"
      ACME_EMAIL: "${ACME_EMAIL:?set ACME_EMAIL}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: "0.5"
    networks:
      - frontend
      - backend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  frontend:
  backend:
    internal: true

volumes:
  caddy_data:
  caddy_config:
