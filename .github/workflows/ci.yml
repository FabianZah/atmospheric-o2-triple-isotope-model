name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      check_two_users:
        description: Run the additional two-calculation memory and result-equivalence audit
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r code/requirements-dev.txt -c code/requirements-api-lock.txt
          pip check

      - name: Public package smoke test
        run: python run_model.py smoke

      - name: Publication contract and integrated acceptance
        run: |
          python -m pytest \
            validation/test_publication_package_smoke.py \
            validation/test_release_artifacts.py \
            validation/test_reproduction_packaging.py \
            validation/test_public_deployment.py \
            validation/test_validation_evidence_bundle.py \
            validation/test_publication_model_contract.py \
            validation/test_publication_model_acceptance.py -q
          python run_model.py acceptance

      - name: Public HTTP API contract
        run: |
          python -m pytest \
            validation/test_api_launcher.py \
            validation/test_web_api.py \
            validation/test_compute_capacity.py \
            validation/test_model_result_workbook.py \
            validation/test_public_cli.py \
            validation/test_isotope_field_contours.py \
            validation/test_constrained_coordinate_resolution.py \
            validation/test_spherule_inversion_acceptance.py -q

      - name: Publication model forward, inverse, posterior, and uncertainty tests
        run: |
          python -m pytest \
            validation/test_updated_molecular_forward_model.py \
            validation/test_forward_isotope_constraints.py \
            validation/test_updated_forward_surface.py \
            validation/test_updated_output_surface.py \
            validation/test_updated_output_surface_release.py \
            validation/test_updated_output_surface_inverse.py \
            validation/test_updated_output_surface_posterior.py \
            validation/test_updated_output_surface_joint_posterior.py \
            validation/test_updated_uncertainty_layers.py \
            validation/test_uncertainty_contract.py -q

      - name: Numerical inference and completed-result reuse
        run: |
          python -m pytest \
            validation/test_posterior_coordinate_quadrature.py \
            validation/test_posterior_field_refinement.py \
            validation/test_posterior_surface_slice.py \
            validation/test_completed_result_cache.py -q

      - name: Sulfate transfer and uncertainty accuracy
        run: |
          python -m pytest \
            validation/test_oxygen_source_mixing.py \
            validation/test_sulfate_to_air.py \
            validation/test_sulfate_transfer_audit.py \
            validation/test_sulfate_fractionation_audit.py \
            validation/test_sulfate_uncertainty.py \
            validation/test_sulfate_likelihood_table.py \
            validation/test_sulfate_web_api.py -q

      - name: Declared transient behavior tests
        run: |
          python -m pytest \
            validation/test_updated_molecular_transient.py \
            validation/test_updated_photosynthesis_transient.py \
            validation/test_updated_pco2_trajectory_transient.py -q

      - name: Core regression tests
        run: python -m pytest validation/test_core.py -q

      - name: Reproduce bundled literature comparisons
        run: python run_model.py reproduce cao-bao luz yang --timeout-seconds 180

      - name: Save literature reproduction reports
        uses: actions/upload-artifact@v4
        with:
          name: literature-reproduction
          path: |
            outputs/cao_bao_2013_multimodel_benchmark.json
            outputs/luz_1999_productivity_benchmark.json
            outputs/yang_2022_co2_tracking_audit.json
            outputs/reproduction/manifest.json
          if-no-files-found: error

      - name: Historical Young-reproduction anchor (expects 26/26)
        run: |
          python validation/audit_young_acceptance_gate.py | tee gate.log
          grep -q "passed 26/26" gate.log

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Validate production Compose and Caddy configuration
        run: |
          docker compose \
            --env-file deploy/.env.production.example \
            -f deploy/compose.production.yaml config --quiet
          env OXYTIB_TRUSTED_PROXIES=127.0.0.1 docker compose \
            --env-file deploy/.env.traefik.example \
            -f deploy/compose.traefik.yaml config --quiet
          docker run --rm \
            -e OXYTIB_DOMAIN=model.example.org \
            -e ACME_EMAIL=researcher@example.org \
            -v "$PWD/deploy/caddy:/etc/caddy:ro" \
            caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Prepare harmless build-exclusion sentinels
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in (".env", ".env.local", ".venv/sentinel.txt", "venv/sentinel.txt",
                       ".tmp/sentinel.txt", "private-build-note.txt", "code/.env",
                       "code/.venv/sentinel.txt", "model_data/.env.local", "web/.env",
                       "web/test-private.key", "code/test-private.pem", "code/test-debug.log"):
              path = Path(name)
              assert not path.exists(), name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text("OXYTIB_BUILD_SENTINEL=harmless\n")
          PY

      - name: Build production application image
        run: >-
          docker build --tag oxytib:ci
          --label "org.opencontainers.image.revision=$GITHUB_SHA"
          --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" .

      - name: Verify build excludes local secrets and environments
        run: |
          docker run --rm --entrypoint python oxytib:ci -c '
          from pathlib import Path
          root = Path("/app")
          for name in (".env", ".env.local", ".venv", "venv", ".tmp", "private-build-note.txt",
                       "code/.env", "code/.venv", "model_data/.env.local", "web/.env",
                       "web/test-private.key", "code/test-private.pem", "code/test-debug.log"):
              assert not (root / name).exists(), name
          print("Build-exclusion sentinels are absent")'

      - name: Start hardened application container
        run: |
          docker run --detach --name oxytib-ci \
            --publish 127.0.0.1:8000:8000 \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            --memory 768m --memory-swap 768m --pids-limit 128 --cpus 0.75 \
            --env OXYTIB_MAX_COMPUTE_REQUESTS=1 \
            --cap-drop ALL --security-opt no-new-privileges \
            oxytib:ci
          docker exec oxytib-ci python -c \
            'from openpyxl.xml import LXML; from lxml import etree; assert LXML, "Streaming XLSX backend is unavailable"; print("Streaming XML backend:", etree.LXML_VERSION)'

      - name: Verify deployed model identity and known answer
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs oxytib-ci
              exit 1
            fi
            sleep 2
          done
          python validation/verify_public_deployment.py \
            --base-url http://127.0.0.1:8000

      - name: Verify dense posterior export within shared-server limits
        timeout-minutes: 12
        run: |
          python validation/verify_public_deployment.py \
            --base-url http://127.0.0.1:8000 --check-dense-export

      - name: Verify two-calculation staging capacity
        if: github.event_name == 'workflow_dispatch' && inputs.check_two_users
        timeout-minutes: 20
        run: |
          python validation/verify_concurrent_deployment.py \
            --base-url http://127.0.0.1:8000 --phase baseline \
            --output outputs/capacity-baseline.json
          docker stop --time 10 oxytib-ci
          docker rm oxytib-ci
          docker run --detach --name oxytib-ci \
            --publish 127.0.0.1:8000:8000 \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            --memory 768m --memory-swap 768m --pids-limit 128 --cpus 0.75 \
            --env OXYTIB_MAX_COMPUTE_REQUESTS=2 \
            --env OXYTIB_COMPUTE_QUEUE_TIMEOUT_SECONDS=120 \
            --cap-drop ALL --security-opt no-new-privileges \
            oxytib:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health >/dev/null; then
              break
            fi
            sleep 2
          done
          python validation/verify_concurrent_deployment.py \
            --base-url http://127.0.0.1:8000 --phase concurrent \
            --reference outputs/capacity-baseline.json \
            --output outputs/capacity-concurrent.json
          docker exec oxytib-ci python -c \
            'from pathlib import Path; import json; p=Path("/sys/fs/cgroup"); d={n:(p/n).read_text().strip() for n in ("memory.max","memory.peak","memory.events")}; print(json.dumps(d)); assert int(d["memory.peak"]) < .9*int(d["memory.max"]), "Insufficient memory headroom for two requests"' \
            > outputs/capacity-memory.json

      - name: Save two-calculation capacity results
        if: always() && github.event_name == 'workflow_dispatch' && inputs.check_two_users
        uses: actions/upload-artifact@v4
        with:
          name: two-calculation-capacity
          path: outputs/capacity-*.json

      - name: Report container memory and exit state
        if: always()
        run: |
          docker inspect --format '{{json .State}}' oxytib-ci
          docker stats --no-stream oxytib-ci
          if [ "$(docker inspect --format '{{.State.Running}}' oxytib-ci)" = "true" ]; then
            docker exec oxytib-ci python -c \
              'from pathlib import Path; root = Path("/sys/fs/cgroup"); [(print(name + ":", (root / name).read_text().strip() if (root / name).exists() else "unavailable")) for name in ("memory.max", "memory.peak", "memory.events")]'
          fi

      - name: Verify graceful container shutdown
        run: |
          docker stop --time 10 oxytib-ci
          python - <<'PY'
          import json
          import subprocess
          state = json.loads(subprocess.check_output([
              "docker", "inspect", "--format", "{{json .State}}", "oxytib-ci"
          ], text=True))
          logs = subprocess.check_output(["docker", "logs", "oxytib-ci"], stderr=subprocess.STDOUT, text=True)
          assert not state["Running"] and not state["OOMKilled"], state
          assert state["ExitCode"] in (0, 143), state
          assert "Application shutdown complete." in logs, logs
          assert "Finished server process" in logs, logs
          print("Graceful shutdown verified:", state["ExitCode"])
          PY

      - name: Archive tested application image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          revision = os.environ['GITHUB_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', revision), revision
          image = json.loads(subprocess.check_output(
              ['docker', 'image', 'inspect', 'oxytib:ci'], text=True))[0]
          container = json.loads(subprocess.check_output(
              ['docker', 'inspect', 'oxytib-ci'], text=True))[0]
          assert container['Image'] == image['Id'], 'Tested image identity changed'
          state = container['State']
          assert not state['Running'] and not state['OOMKilled'], state
          assert state['ExitCode'] in (0, 143), state
          assert image['Config']['Labels']['org.opencontainers.image.revision'] == revision
          tag = 'oxytib:' + revision
          subprocess.run(['docker', 'tag', image['Id'], tag], check=True)
          output = Path('outputs/container-image')
          output.mkdir(parents=True, exist_ok=False)
          metadata = {
              'commit': revision, 'image_tag': tag, 'image_id': image['Id'],
              'repository': os.environ['GITHUB_REPOSITORY'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'os': image['Os'], 'architecture': image['Architecture'],
              'image_size_bytes': image['Size'],
          }
          (output / 'image.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PY
          docker save "oxytib:$GITHUB_SHA" | gzip -1 > outputs/container-image/image.tar.gz
          cd outputs/container-image
          sha256sum image.tar.gz image.json > SHA256SUMS

      - name: Save tested application image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: oxytib-image-${{ github.sha }}
          path: |
            outputs/container-image/image.tar.gz
            outputs/container-image/image.json
            outputs/container-image/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Show container logs on failure
        if: failure()
        run: docker logs oxytib-ci

      - name: Stop application container
        if: always()
        run: docker rm --force oxytib-ci || true
